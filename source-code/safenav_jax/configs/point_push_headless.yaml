env_id: point_push_headless
params:
  backend: mjx
  n_frames: 10
  episode_length: 1000
  reset_noise_scale: 0.0
  agent_spawn_bound: null
  playground_size: 2.0
  goal_wall_margin: 0.4
  min_goal_dist: 1.0
  max_goal_dist: 3.0
  goal_radius: 0.3
  num_hazards: 8
  hazard_radius: 0.3
  cube_half_size: 0.2
  cube_density: 0.001
  layout_margin: 0.0
  agent_keepout: 0.4
  goal_keepout: 0.4
  hazard_keepout: 0.4
  cube_keepout: 0.2
  max_agent_cube_reset_dist: 1.0
  include_object_layout_obs: true
  ego_view: false
  relocate_objects_on_reset: true
  fixed_object_layout_seed: 0
  different_object_layout_per_env: false
  goal_respawn_on_success: true
  respawn_goal_require_path_objects: false
  respawn_goal_min_path_objects: 1
  respawn_goal_path_band_scale: 1.0
  terminate_on_cost: false
  cost_limit_max: 25.0
  robot_cost_margin: 0.0
  object_boundary: false
  fixed_agent_on_reset: false
  fixed_goal_on_reset: false
  uniform_initial_goal_sampling: true
  first_valid_layout_candidate: true
