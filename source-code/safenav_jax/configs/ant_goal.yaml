env_id: ant_goal
params:
  backend: mjx
  n_frames: 10
  episode_length: 1000
  reset_noise_scale: 0.1
  min_goal_dist: 4.0  # Evaluation/direct-env default; training overrides to 0.0.
  max_goal_dist: 7.0
  goal_radius: 0.9
  healthy_z_range: [0.2, 1.0]
  playground_size: 10.0
  agent_wall_margin: 2.0
  goal_wall_margin: 1.0
  num_hazards: 12
  num_gremlins: 3
  hazard_radius: 0.75
  hazard_height: 0.5
  gremlin_radius: 0.5
  gremlin_height: 0.01
  gremlin_travel: 1.5
  gremlin_speed: 0.1
  layout_margin: 0.0
  agent_keepout: 1.5
  goal_keepout: 1.5
  hazard_keepout: 1.5
  gremlin_keepout: 1.0
  relocate_objects_on_reset: true
  fixed_object_layout_seed: 0
  different_object_layout_per_env: false
  goal_respawn_on_success: true
  respawn_goal_require_path_objects: false
  respawn_goal_min_path_objects: 1
  respawn_goal_path_band_scale: 1.0
  terminate_on_cost: false
  cost_limit_max: 25.0
  robot_cost_margin: 0.20
  object_boundary: true
  fixed_agent_on_reset: false
  fixed_goal_on_reset: false
  uniform_initial_goal_sampling: true
  first_valid_layout_candidate: true
  include_object_layout_obs: true
  layout_lidar_num_bins: 16
  full_robot_observation: true
