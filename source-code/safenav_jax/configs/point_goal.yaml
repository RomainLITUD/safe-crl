env_id: point_goal
params:
  backend: mjx
  n_frames: 10
  episode_length: 1000
  reset_noise_scale: 0.0
  agent_spawn_bound: null
  playground_size: 2.0
  goal_wall_margin: 0.305
  min_goal_dist: 1.5
  max_goal_dist: 3.0
  goal_radius: 0.3
  num_hazards: 8
  num_obstacles: 4
  num_gremlins: 6
  hazard_radius: 0.2
  obstacle_radius: 0.1
  obstacle_height: 0.1
  gremlin_radius: 0.1
  gremlin_height: 0.1
  gremlin_travel: 0.35
  gremlin_speed: 1.0
  layout_margin: 0.0
  agent_keepout: 0.4
  goal_keepout: 0.305
  hazard_keepout: 0.18
  obstacle_keepout: 0.15
  gremlin_keepout: 0.15
  include_object_layout_obs: true
  ego_view: true
  parking_mode: false
  parking_yaw_tolerance_degrees: 20.0
  relocate_objects_on_reset: true
  fixed_object_layout_seed: 0
  different_object_layout_per_env: false
  goal_respawn_on_success: true
  respawn_goal_require_path_objects: true
  respawn_goal_min_path_objects: 1
  respawn_goal_path_band_scale: 1.0
  terminate_on_cost: false
  cost_limit_max: 25.0
  robot_cost_margin: 0.0
  object_boundary: false
  fixed_agent_on_reset: false
  fixed_goal_on_reset: false
  uniform_initial_goal_sampling: true
  first_valid_layout_candidate: true
